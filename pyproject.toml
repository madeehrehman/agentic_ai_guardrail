[project]
name = "agentic-guardrail"
version = "0.1.0"
description = "LangGraph guardrails learning lab — banking regulatory workflow assistant"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
regulatory-hitl-demo = "agentic_guardrail.phase1.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
