[project]
name = "agentic-guardrail"
version = "0.1.0"
description = "LangGraph guardrails learning lab — banking regulatory workflow assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
phase5 = ["guardrails-ai>=0.6"]
nemo = ["nemoguardrails>=0.11"]
# After pip install -e ., run: python -m spacy download en_core_web_sm

[project.scripts]
regulatory-hitl-demo = "agentic_guardrail.phase1.demo:main"
regulatory-workflow-demo = "agentic_guardrail.phase2.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
